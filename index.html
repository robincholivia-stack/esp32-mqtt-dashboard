<!DOCTYPE html>

<html>

<head>

<title>IoT Lab Dashboard</title>

<script src=
"https://unpkg.com/mqtt/dist/mqtt.min.js">
</script>

<style>

body {
    font-family: Arial;
    text-align: center;
    margin-top: 50px;
}

.dashboard {
    width: 350px;
    margin: auto;
    padding: 30px;
    border: 1px solid #ccc;
    border-radius: 10px;
}

.temperature {
    font-size: 48px;
    margin: 20px;
}

</style>

</head>

<body>

<div class="dashboard">

<h1>IoT Dashboard</h1>

<h2>Temperature</h2>

<div
    class="temperature"
    id="temperature">
    -- °C
</div>

<p id="status">
Connecting to MQTT...
</p>

</div>

<script>

const broker =
    "broker.hivemq.com";

const client =
    mqtt.connect(broker);

client.on(
    "connect",
    function ()
    {
        document.getElementById(
            "status"
        ).innerText =
            "MQTT Connected";

        client.subscribe(
            "iot/lab/temperature"
        );
    }
);

client.on(
    "message",
    function(topic, message)
    {
        const value =
            message.toString();

        document.getElementById(
            "temperature"
        ).innerText =
            value + " °C";
    }
);

client.on(
    "error",
    function(error)
    {
        document.getElementById(
            "status"
        ).innerText =
            "MQTT Connection Error";

        console.log(error);
    }
);

</script>

</body>

</html>
